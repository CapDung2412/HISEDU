[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hisedu-retrieval"
version = "0.1.0"
description = "Vietnamese history question retrieval with multilingual CLIP and Pinecone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.66,<3",
  "Pillow>=10,<13",
  "pinecone>=10,<11",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "sentence-transformers[image]>=5,<6",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.7,<4"]

[project.scripts]
hisedu = "hisedu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
